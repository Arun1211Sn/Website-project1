<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="Manrope, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">GST Road land, Kattankulathur – site sketch</title>
  <desc id="d">About 16 grounds facing the GST Road service road between Tambaram and Chengalpattu, next to the BDO office. Sides 170 ft (road front), 159 ft, 277 ft and 223 ft.</desc>
  <rect width="560" height="520" fill="#faf8ef"/>
  <!-- compass as drawn on the owner's sketch: east at the top -->
  <g transform="translate(500 58)" font-size="13" font-weight="800" fill="#1c1d1b" text-anchor="middle">
    <path d="M0-30V30M-30 0H30" stroke="#1c1d1b" stroke-width="2"/>
    <path d="M0-34l-6 10h12z" fill="#c9a400"/>
    <text y="-40">E</text><text y="50">W</text><text x="-42" y="5">N</text><text x="42" y="5">S</text>
  </g>
  <polygon points="110,70 420,126 434,370 104,370" fill="#f3df3c" fill-opacity=".35" stroke="#1c1d1b" stroke-width="3" stroke-linejoin="round"/>
  <g font-size="15" font-weight="800" fill="#1c1d1b" text-anchor="middle">
    <text x="268" y="88" transform="rotate(10 268 88)">159 ft</text>
    <text x="270" y="394">170 ft · road frontage</text>
    <text x="84" y="222" transform="rotate(-90 84 222)">277 ft</text>
    <text x="455" y="250" transform="rotate(90 455 250)">223 ft</text>
    <text x="268" y="232" font-size="22">≈ 16 grounds</text>
    <text x="268" y="256" font-size="13" font-weight="600" fill="#55564f">Direct owner</text>
  </g>
  <text x="40" y="222" font-size="12" font-weight="700" fill="#8a6d00" text-anchor="middle" transform="rotate(-90 40 222)">BDO OFFICE</text>
  <!-- roads -->
  <rect x="0" y="412" width="560" height="26" fill="#d9d6c8"/>
  <text x="280" y="430" font-size="12" font-weight="800" fill="#1c1d1b" text-anchor="middle" letter-spacing="2">SERVICE ROAD</text>
  <rect x="0" y="446" width="560" height="54" fill="#1c1d1b"/>
  <path d="M0 473H560" stroke="#f3df3c" stroke-width="2" stroke-dasharray="18 14"/>
  <text x="280" y="466" font-size="15" font-weight="800" fill="#f3df3c" text-anchor="middle" letter-spacing="3">G.S.T. ROAD</text>
  <g font-size="12" font-weight="700" fill="#fff">
    <text x="14" y="492">← TAMBARAM</text>
    <text x="546" y="492" text-anchor="end">CHENGALPATTU →</text>
  </g>
  <text x="14" y="26" font-size="11" fill="#55564f">Redrawn from the owner's sketch · not to scale</text>
</svg>
